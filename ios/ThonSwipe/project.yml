# Generate the Xcode project with XcodeGen:  brew install xcodegen && cd ios/ThonSwipe && xcodegen
name: ThonSwipe
options:
  bundleIdPrefix: org.thon
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    # Set your team in Xcode (Signing & Capabilities), or add DEVELOPMENT_TEAM here.
targets:
  ThonSwipe:
    type: application
    platform: iOS
    sources:
      - path: ThonSwipe
      - path: ../../Sources/Thon/Phone/PhoneWire.swift     # the wire format shared with the Mac app
        group: Shared
    info:
      path: ThonSwipe/Info.plist
      properties:
        CFBundleDisplayName: Thon Swipe
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocalNetworkUsageDescription: Thon Swipe talks to Thon on your Mac to show candidate particles and send your decisions.
        NSBonjourServices: [_thon-swipe._tcp, _thon-swipe._udp]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.thon.swipe
        TARGETED_DEVICE_FAMILY: "1"
  ThonSwipeTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ThonSwipeTests]
    dependencies:
      - target: ThonSwipe
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ThonSwipe:
    build:
      targets: { ThonSwipe: all }
    test:
      targets: [ThonSwipeTests]
